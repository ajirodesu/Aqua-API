<!doctype html>
<html lang="en" class="dark" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1112" />
    <title>Aqua APIs — Simple and easy to use</title>
    <meta name="description" content="Aqua APIs: a fast, friendly REST API playground and documentation." />
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
      try {
        var t = localStorage.getItem('aqua-ui-theme');
        var legacy = { aqua: 'emerald', burnt: 'jasper', indigo: 'amethyst' };
        if (legacy[t]) t = legacy[t];
        if (t === 'emerald' || t === 'jasper' || t === 'amethyst') {
          document.documentElement.setAttribute('data-theme', t);
        } else {
          document.documentElement.setAttribute('data-theme', 'emerald');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'emerald');
      }
    </script>
  </head>
  <body class="bg-surface text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
